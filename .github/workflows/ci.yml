name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: watch_bot
          POSTGRES_PASSWORD: watch_bot
          POSTGRES_DB: watch_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watch_bot -d watch_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_CONNECTION_STR: postgres://watch_bot:watch_bot@localhost:5432/watch_bot_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

      - name: Run static analysis
        run: make vet

      - name: Run race detector
        run: make race

      - name: Run PostgreSQL integration tests
        run: make integration-test

      - name: Build application
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: watch_bot
          path: .bin/watch_bot

  docker:
    needs: test-and-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Get latest tag
        id: get_tag
        run: |
          current=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          major=$(echo $current | cut -d. -f1)
          minor=$(echo $current | cut -d. -f2)
          patch=$(echo $current | cut -d. -f3)
          new_minor=$((minor + 1))
          new_tag="${major}.${new_minor}.0"
          echo "NEW_TAG=$new_tag" >> $GITHUB_ENV

      - name: Create and push tag
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/watch_bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/watch_bot:${{ env.NEW_TAG }}
